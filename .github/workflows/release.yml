name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v0.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.runtime }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        runtime:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: osx-x64
            os: macos-13
          - runtime: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt update
          sudo apt -y install libarchive-tools

      - name: Build x64
        if: contains(matrix.runtime, 'x64')
        shell: bash
        run: pnpm run build

      - name: Build ARM64
        if: contains(matrix.runtime, 'arm64')
        shell: bash
        run: pnpm run build:arm64

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            build/*.*
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build & Package Web Version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build Web
        shell: bash
        run: pnpm run pack:web

      - name: Archive Web bundle as Zip
        shell: bash
        run: |
          cd dist
          zip -r ../snorlex-web.zip web/

      - name: Upload Web Zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: snorlex-web.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
