name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v0.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        runtime:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-armv7l
          - osx-x64
          - osx-arm64
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-armv7l
            os: ubuntu-latest
          - runtime: osx-x64
            os: macos-13
          - runtime: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Build Standard (x64)
        if: contains(matrix.runtime, 'x64')
        run: pnpm run build

      - name: Build ARM64
        if: contains(matrix.runtime, 'arm64')
        run: pnpm run build:arm64

      - name: Build ARM32 (ARMv7l)
        if: contains(matrix.runtime, 'armv7l')
        run: pnpm run build:arm32

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            build/*.exe
            build/*.dmg
            build/*.deb
            build/*.AppImage
            build/*.rpm
            build/*.pacman
            build/*.zip
            build/*.7z
            build/*.blockmap
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build & Package Web Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm run pack:web

      - name: Archive Web bundle as Zip
        run: |
          cd dist
          zip -r ../snorlex-web.zip web/

      - name: Upload Web Zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: snorlex-web.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
